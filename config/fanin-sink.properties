# Sample configuration for the fan-in sink (Connect standalone / reference only).
name=fanin-sink
connector.class=com.example.fanin.FanInSinkConnector
tasks.max=1

# Subscription: set exactly one of topics / topics.regex. Keep the regex RE2J compatible
# (no lookaheads, no backreferences). The target topic must NOT match it.
topics.regex=^acme\\.app\\..+

# Records pass through untouched, whatever their schema.
key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter
header.converter=org.apache.kafka.connect.converters.ByteArrayConverter

fanin.target.topic=fanin-out
fanin.target.bootstrap.servers=<bootstrap-host>:9092
fanin.target.api.key=<api-key>
fanin.target.api.secret=<api-secret>

# fanin.output.mode=HEADERS            # or JSON_ENVELOPE
# fanin.partitioning.mode=SOURCE_PARTITION_HASH   # or KEY_HASH
# fanin.producer.compression.type=lz4
