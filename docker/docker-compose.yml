# Local test stack: single-node Apache Kafka (KRaft) + one distributed Connect worker.
# Plugin is mounted from the Maven build output (run scripts/build.sh first).
name: fanin-it

services:
  broker:
    image: apache/kafka:4.2.0
    container_name: fanin-it-broker
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the tests (needed for L6, where the target is deleted).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  connect:
    image: apache/kafka:4.2.0
    container_name: fanin-it-connect
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8083:8083"
    entrypoint: ["/opt/kafka/bin/connect-distributed.sh", "/etc/connect/connect.properties"]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms512m"
    volumes:
      - ./connect.properties:/etc/connect/connect.properties:ro
      # Only lib/ is mounted: Connect loads every jar in a plugin directory.
      - ../target/components/packages/example-fanin-connector-0.1.0/example-fanin-connector-0.1.0/lib:/plugins/fanin:ro
